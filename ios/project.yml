# The Xcode project is generated from this file. `Polaris.xcodeproj` is build output and is
# gitignored — committing it invites merge conflicts over a file nobody edits by hand.
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
name: Polaris

options:
  bundleIdPrefix: com.peixotolabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  PolarisCore:
    path: PolarisCore

schemes:
  Polaris:
    build:
      targets:
        Polaris: all
        PolarisTests: [test]
        PolarisUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PolarisTests, PolarisUITests]
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Polaris:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Polaris
    dependencies:
      - package: PolarisCore
    info:
      path: Polaris/Info.plist
      properties:
        CFBundleDisplayName: Polaris
        # Literal values here make App Store uploads bounce once the build number stops
        # being 1; both must interpolate from the build settings below.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleIconName: AppIcon
        # Skips the "Missing Compliance" gate in App Store Connect, which otherwise blocks
        # every build behind a manual questionnaire.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        # All four, because TARGETED_DEVICE_FAMILY includes iPad and an iPad app that does
        # not declare UIRequiresFullScreen must support every orientation — omitting one
        # warns at archive time and is rejected at validation.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The development stack is plain HTTP on localhost. This exception is scoped to
        # localhost alone rather than opening arbitrary loads: the hosted instance is HTTPS
        # and must stay that way.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        # Set explicitly. XcodeGen emits no PRODUCT_NAME when the target name would do, and
        # Xcode does not fall back to $(TARGET_NAME) — the product builds as a nameless
        # `.app`, and the failure surfaces as "Multiple commands produce .app" from the
        # universal-binary step, which points nowhere near the cause.
        PRODUCT_NAME: Polaris
        PRODUCT_BUNDLE_IDENTIFIER: com.peixotolabs.polaris
        DEVELOPMENT_TEAM: H874DPF6H5
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          # Automatic is right for the simulator: there is no profile to keep in sync, and a
          # developer without the distribution key can still build and run.
          CODE_SIGN_STYLE: Automatic
          ONLY_ACTIVE_ARCH: "YES"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
          ENABLE_TESTABILITY: "YES"
        Release:
          # Manual, because Automatic needs an interactively-authenticated Xcode and will not
          # resolve a profile from a script or CI. The profile is created idempotently by
          # ios/scripts/asc-setup.py, which reuses the team's single Apple Distribution
          # certificate rather than minting a second one.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Polaris App Store"

  # Drives the real app in a simulator. Paired with `-polaris-fixtures`, which swaps in the
  # in-memory client, so every signed-in screen is reachable with no server, no database and
  # no account — the state this machine is actually in.
  PolarisUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PolarisUITests
    dependencies:
      - target: Polaris
    settings:
      base:
        # Matches the app target's Debug setting. Without it the test bundles build
        # x86_64 while PolarisCore builds arm64 only, and `xcodebuild test` fails to
        # resolve the package — the suite does not run at all.
        ONLY_ACTIVE_ARCH: "YES"
        PRODUCT_NAME: PolarisUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.peixotolabs.polaris.uitests
        # A test bundle has no Info.plist of its own and codesign refuses to sign without
        # one. Xcode generates it when asked; nothing else will.
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: H874DPF6H5
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: Polaris

  PolarisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PolarisTests
    dependencies:
      - target: Polaris
      - package: PolarisCore
    settings:
      base:
        # Matches the app target's Debug setting. Without it the test bundles build
        # x86_64 while PolarisCore builds arm64 only, and `xcodebuild test` fails to
        # resolve the package — the suite does not run at all.
        ONLY_ACTIVE_ARCH: "YES"
        PRODUCT_NAME: PolarisTests
        PRODUCT_BUNDLE_IDENTIFIER: com.peixotolabs.polaris.tests
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_TEAM: H874DPF6H5
        SWIFT_VERSION: "6.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Polaris.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Polaris"
        BUNDLE_LOADER: "$(TEST_HOST)"
