packages:
  - web
  - desktop

# esbuild ships a platform binary and needs its postinstall to run; Vite will not start
# without it. Declared explicitly because pnpm 10+ blocks build scripts by default, and
# the failure it produces otherwise ("cannot find esbuild binary") does not point here.
allowBuilds:
  # Electron's postinstall downloads the platform binary. Without it `electron .` fails
  # with "Electron failed to install correctly", which reads like a corrupt install rather
  # than a blocked build script.
  electron: true
  # Denied rather than left unanswered, because an unanswered entry fails `pnpm install`
  # outright — and that failure then blocks every `pnpm run` in the workspace, which reads
  # as a broken lockfile rather than a question waiting for an answer.
  #
  # It arrived with electron-builder 26, which depends on electron-builder-squirrel-windows
  # unconditionally. Its postinstall downloads the Squirrel.Windows binaries. Polaris ships
  # NSIS on Windows (see the `win` target in desktop/electron-builder.yml), so nothing here
  # will ever invoke Squirrel, and running the script would spend a download per install on
  # a code path with no caller.
  electron-winstaller: false
  esbuild: true
