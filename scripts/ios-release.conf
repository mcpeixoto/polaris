# What this app is called and where it lives — the per-repo half of the pipeline.
#
# Both routes read it: .github/workflows/ios-release.yml on a v* tag, and
# scripts/release-ios.sh on this Mac. So the two cannot disagree about which scheme to
# build or which .ipa to upload, and the workflow itself is byte-identical to the copy in
# every other app in this account.
#
# Shell syntax. Quote any value with a space: both readers do `set -a; . conf`, and an
# unquoted `GENERATE=xcodegen generate` would run the command `generate` instead.
IOS_DIR=ios
GENERATE='xcodegen generate'
XCODE_PROJECT=Polaris.xcodeproj
SCHEME=Polaris
IPA=Polaris.ipa
EXPORT_OPTIONS=ExportOptions.plist   # relative to IOS_DIR
BUNDLE_ID=com.peixotolabs.polaris
SWIFT_TEST_DIR=ios/PolarisCore       # the fast gate; a tag can be cut from any commit, so
                                     # the core suite runs against this exact tree
TEAM_ID=                             # ios/project.yml already sets DEVELOPMENT_TEAM
