# ---------------------------------------------------------------- root

type Query {
  """Everything the client needs to render its shell."""
  viewer: Viewer!

  workspace: Workspace!
  teams: [Team!]!
  team(id: UUID!): Team
  teamByKey(key: String!): Team

  users: [User!]!
  user(id: UUID!): User

  issue(id: UUID!): Issue
  issueByIdentifier(identifier: String!): Issue
  issues(teamId: UUID!): [Issue!]!

  workflowStates(teamId: UUID!): [WorkflowState!]!
  comments(issueId: UUID!): [Comment!]!
  issueHistory(issueId: UUID!): [IssueHistoryEntry!]!

  """Every label the caller can see: workspace labels plus those of their teams."""
  labels: [Label!]!
  label(id: UUID!): Label

  """Every project label in the workspace."""
  projectLabels: [ProjectLabel!]!
  projectLabel(id: UUID!): ProjectLabel

  """Saved views the caller can see: shared ones in scope, plus their own private ones."""
  views: [View!]!
  view(id: UUID!): View
  viewPreferences: [ViewPreference!]!

  favorites: [Favorite!]!

  issueTemplates(teamId: UUID): [IssueTemplate!]!
  issueTemplate(id: UUID!): IssueTemplate

  formTemplates(teamId: UUID): [FormTemplate!]!
  formTemplate(id: UUID!): FormTemplate
  formTemplateFields(formTemplateId: UUID!): [FormTemplateField!]!

  projectTemplates(teamId: UUID): [ProjectTemplate!]!
  projectTemplate(id: UUID!): ProjectTemplate
  projectTemplateMilestones(projectTemplateId: UUID!): [ProjectTemplateMilestone!]!
  projectTemplateIssues(projectTemplateId: UUID!): [ProjectTemplateIssue!]!

  recurringIssues(teamId: UUID!): [RecurringIssue!]!
  recurringIssue(id: UUID!): RecurringIssue

  projects: [Project!]!
  project(id: UUID!): Project
  projectStatuses: [ProjectStatus!]!

  cycles(teamId: UUID!): [Cycle!]!
  cycle(id: UUID!): Cycle

  """The caller's inbox. Snoozed rows are excluded until they wake unless includeSnoozed."""
  notifications(includeRead: Boolean, includeSnoozed: Boolean, first: Int): [Notification!]!
  unreadNotificationCount: Int!

  """Issues assigned to the caller, across every team they can see."""
  myIssues(includeCompleted: Boolean): [Issue!]!

  search(input: SearchInput!): SearchResults!

  """The caller's own keys. Never anybody else's, and never the tokens."""
  apiKeys: [ApiKey!]!

  """Workspace webhooks. Admins only; the signing secret is never returned."""
  webhooks: [Webhook!]!
  webhookDeliveries(webhookId: UUID!, first: Int): [WebhookDelivery!]!

  """
  The caller's saved drafts. Local composer restore never appears here — only drafts
  saved across devices, still inside the six-month window.
  """
  drafts: [Draft!]!

  """Pending invitations. Admins only."""
  invites: [Invite!]!

  """
  Issues deleted within the restore window, so a mistaken delete is recoverable without a
  support ticket.
  """
  deletedIssues: [Issue!]!

  """
  Teams deleted within the restore window. Loaded on demand, never replicated — the sync
  stream carries a delete for a removed team rather than the row.
  """
  deletedTeams: [Team!]!

  """Archived issues, cycles and projects for one team. Loaded on demand, never replicated."""
  archivedIssues(teamId: UUID!): [Issue!]!
  archivedCycles(teamId: UUID!): [Cycle!]!
  archivedProjects(teamId: UUID!): [Project!]!

  """Every live attachment in this workspace that carries this exact URL."""
  attachmentsForURL(url: String!): [Attachment!]!

  document(id: UUID!): Document

  projectUpdate(id: UUID!): ProjectUpdate
  projectUpdates(projectId: UUID!): [ProjectUpdate!]!

  projectDependenciesBlocking(projectId: UUID!): [ProjectDependency!]!
  projectDependenciesBlockedBy(projectId: UUID!): [ProjectDependency!]!

  initiatives: [Initiative!]!
  initiative(id: UUID!): Initiative

  customers: [Customer!]!
  customer(id: UUID!): Customer
  customerRequest(id: UUID!): CustomerRequest

  slaRules: [SlaRule!]!
  slaRule(id: UUID!): SlaRule

  """The workspace GitHub install, if any. Secrets are on githubCommitWebhook, not here."""
  githubConnection: GitHubConnection
  """The caller's linked GitHub account, if they have connected one."""
  githubUserLink: GitHubUserLink
  """Whether this install has GitHub OAuth app credentials in its environment."""
  githubOAuthConfigured: Boolean!
  """Admin-only. The URL and secret to paste into GitHub for commit linking."""
  githubCommitWebhook: GitHubCommitWebhook
  """Per-team GitHub PR status automations. Unconfigured teams use the product defaults."""
  githubTeamAutomation(teamId: UUID!): GitHubTeamAutomation!
}

"""
Mutations carry an idempotency key so a client can retry a dropped response from its
offline outbox without applying the write twice. The server records (clientId, opId) for
24 hours and replays the original result.
"""
directive @idempotent on FIELD_DEFINITION

type Mutation {
  createIssue(input: CreateIssueInput!, clientId: UUID, opId: UUID): IssuePayload! @idempotent
  updateIssue(input: UpdateIssueInput!, clientId: UUID, opId: UUID): IssuePayload! @idempotent
  archiveIssue(id: UUID!, archived: Boolean!, clientId: UUID, opId: UUID): DeletePayload! @idempotent
  deleteIssue(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  createComment(input: CreateCommentInput!, clientId: UUID, opId: UUID): CommentPayload! @idempotent
  updateComment(id: UUID!, body: String!, clientId: UUID, opId: UUID): CommentPayload! @idempotent
  resolveComment(id: UUID!, resolved: Boolean!, clientId: UUID, opId: UUID): CommentPayload! @idempotent
  deleteComment(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  createAttachment(input: CreateAttachmentInput!, clientId: UUID, opId: UUID): AttachmentPayload! @idempotent
  updateAttachment(input: UpdateAttachmentInput!, clientId: UUID, opId: UUID): AttachmentPayload! @idempotent
  deleteAttachment(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  createDocument(input: CreateDocumentInput!, clientId: UUID, opId: UUID): DocumentPayload! @idempotent
  updateDocument(input: UpdateDocumentInput!, clientId: UUID, opId: UUID): DocumentPayload! @idempotent
  archiveDocument(id: UUID!, archived: Boolean!, clientId: UUID, opId: UUID): DeletePayload! @idempotent
  deleteDocument(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  createProjectUpdate(input: CreateProjectUpdateInput!, clientId: UUID, opId: UUID): ProjectUpdatePayload! @idempotent
  updateProjectUpdate(input: UpdateProjectUpdateInput!, clientId: UUID, opId: UUID): ProjectUpdatePayload! @idempotent
  deleteProjectUpdate(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  addProjectDependency(blockingProjectId: UUID!, blockedProjectId: UUID!, clientId: UUID, opId: UUID): ProjectDependencyPayload! @idempotent
  removeProjectDependency(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  createInitiative(input: CreateInitiativeInput!, clientId: UUID, opId: UUID): InitiativePayload! @idempotent
  updateInitiative(input: UpdateInitiativeInput!, clientId: UUID, opId: UUID): InitiativePayload! @idempotent
  archiveInitiative(id: UUID!, archived: Boolean!, clientId: UUID, opId: UUID): DeletePayload! @idempotent
  deleteInitiative(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent
  addInitiativeProject(initiativeId: UUID!, projectId: UUID!, clientId: UUID, opId: UUID): InitiativeProjectPayload! @idempotent
  removeInitiativeProject(initiativeId: UUID!, projectId: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  createCustomer(input: CreateCustomerInput!, clientId: UUID, opId: UUID): CustomerPayload! @idempotent
  updateCustomer(input: UpdateCustomerInput!, clientId: UUID, opId: UUID): CustomerPayload! @idempotent
  archiveCustomer(id: UUID!, archived: Boolean!, clientId: UUID, opId: UUID): DeletePayload! @idempotent
  deleteCustomer(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent
  createCustomerRequest(input: CreateCustomerRequestInput!, clientId: UUID, opId: UUID): CustomerRequestPayload! @idempotent
  updateCustomerRequest(input: UpdateCustomerRequestInput!, clientId: UUID, opId: UUID): CustomerRequestPayload! @idempotent
  deleteCustomerRequest(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  createSlaRule(input: CreateSlaRuleInput!, clientId: UUID, opId: UUID): SlaRulePayload! @idempotent
  updateSlaRule(input: UpdateSlaRuleInput!, clientId: UUID, opId: UUID): SlaRulePayload! @idempotent
  deleteSlaRule(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent
  setIssueSla(input: SetIssueSlaInput!, clientId: UUID, opId: UUID): IssuePayload! @idempotent
  clearIssueSla(issueId: UUID!, clientId: UUID, opId: UUID): IssuePayload! @idempotent

  createTeam(input: CreateTeamInput!): TeamPayload!
  updateTeam(input: UpdateTeamInput!): TeamPayload!
  """Nest under a parent, or pass null to make a top-level team."""
  moveTeam(teamId: UUID!, parentTeamId: UUID, clientId: UUID, opId: UUID): TeamPayload! @idempotent
  """Freezes a team: read-only issues and settings, hidden from sidebars. Restorable any time."""
  retireTeam(id: UUID!, clientId: UUID, opId: UUID): TeamPayload! @idempotent
  """Brings a retired team back to active use."""
  unretireTeam(id: UUID!, clientId: UUID, opId: UUID): TeamPayload! @idempotent
  """Soft-deletes a team and its issues. Restorable within 30 days."""
  deleteTeam(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent
  """Restores a soft-deleted team and its issues, within the window."""
  restoreTeam(id: UUID!, clientId: UUID, opId: UUID): TeamPayload! @idempotent
  addTeamMember(teamId: UUID!, userId: UUID!, role: TeamRole): TeamMembershipPayload!
  removeTeamMember(teamId: UUID!, userId: UUID!): DeletePayload!

  createWorkflowState(input: CreateWorkflowStateInput!): WorkflowStatePayload!
  updateWorkflowState(input: UpdateWorkflowStateInput!): WorkflowStatePayload!
  """
  Retires a status, or brings one back. `archived: false` is the way back; without it the
  only way to undo a mistaken archive is to create a new status, which is a different row
  that no filter or saved view already points at.
  """
  archiveWorkflowState(id: UUID!, archived: Boolean!): DeletePayload!

  updateProfile(input: UpdateProfileInput!): UserPayload!
  setUserRole(userId: UUID!, role: UserRole!): UserPayload!
  suspendUser(userId: UUID!, suspended: Boolean!): UserPayload!
  removeUser(userId: UUID!): DeletePayload!
  updateNotificationPrefs(prefs: JSON!): UserPayload!

  updateWorkspace(input: UpdateWorkspaceInput!): WorkspacePayload!

  # ---- issues, continued

  bulkUpdateIssues(input: BulkUpdateIssuesInput!, clientId: UUID, opId: UUID): BulkIssuePayload! @idempotent
  """Restores a soft-deleted issue with its comments and relations, within the window."""
  restoreIssue(id: UUID!, clientId: UUID, opId: UUID): IssuePayload! @idempotent

  """
  Empties the trash. Admins only, and irreversible.

  This is a hard DELETE, and the blast radius is everything hanging off each issue: its
  comments, its labels, its relations from both ends and its whole activity feed all go with
  it, by foreign-key cascade. Sub-issues are not deleted — `issue.parent_id` is
  ON DELETE SET NULL — but they are orphaned, and nothing afterwards records which parent
  they had. There is no restore, no trash behind the trash, and no version of the row left
  anywhere but a database backup.

  `before` purges only what was deleted before that instant, which is what makes an
  unattended retention sweep expressible; omit it to empty the trash completely.
  """
  purgeDeletedIssues(before: Time): PurgePayload!

  updateTeamEstimates(input: UpdateTeamEstimatesInput!): TeamPayload!
  updateTeamCycles(input: UpdateTeamCyclesInput!): TeamPayload!
  updateCycle(input: UpdateCycleInput!, clientId: UUID, opId: UUID): CyclePayload! @idempotent
  """Pull the next upcoming cycle forward to midnight today in the team's timezone. Irreversible."""
  startCycleToday(id: UUID!, clientId: UUID, opId: UUID): CyclePayload! @idempotent
  updateTeamTriage(input: UpdateTeamTriageInput!): TeamPayload!
  updateTeamEmailIntake(input: UpdateTeamEmailIntakeInput!): TeamPayload!
  updateIssueTemplateEmailIntake(input: UpdateIssueTemplateEmailIntakeInput!): IssueTemplatePayload!
  updateTeamArchive(input: UpdateTeamArchiveInput!): TeamPayload!
  updateTeamTemplates(input: UpdateTeamTemplatesInput!): TeamPayload!

  archiveCycle(id: UUID!, archived: Boolean!, clientId: UUID, opId: UUID): DeletePayload! @idempotent
  archiveProject(id: UUID!, archived: Boolean!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  acceptTriageIssue(id: UUID!, clientId: UUID, opId: UUID): IssuePayload! @idempotent
  declineTriageIssue(id: UUID!, clientId: UUID, opId: UUID): IssuePayload! @idempotent
  """The issue being viewed is the duplicate; canonicalId is the one it duplicates."""
  markIssueDuplicate(id: UUID!, canonicalId: UUID!, clientId: UUID, opId: UUID): IssuePayload! @idempotent
  snoozeIssue(id: UUID!, until: Time!, clientId: UUID, opId: UUID): IssuePayload! @idempotent

  # ---- labels

  createLabel(input: CreateLabelInput!, clientId: UUID, opId: UUID): LabelPayload! @idempotent
  updateLabel(input: UpdateLabelInput!, clientId: UUID, opId: UUID): LabelPayload! @idempotent
  """
  Retires a label, or brings one back.

  Un-archiving is refused while the group the label sits in is still archived: the label
  would reappear in the picker under a heading nothing can resolve, which is the same state
  archiving a non-empty group is refused to prevent, reached from the other side.
  """
  archiveLabel(id: UUID!, archived: Boolean!): DeletePayload!

  """
  Adds one label. Not "set the labels": a whole-set write means two people adding
  different labels a second apart produce one winner and one silently lost edit.
  """
  addIssueLabel(issueId: UUID!, labelId: UUID!, clientId: UUID, opId: UUID): IssueLabelPayload! @idempotent
  removeIssueLabel(issueId: UUID!, labelId: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  # ---- project labels

  createProjectLabel(input: CreateProjectLabelInput!): ProjectLabelPayload!
  updateProjectLabel(input: UpdateProjectLabelInput!): ProjectLabelPayload!
  archiveProjectLabel(id: UUID!, archived: Boolean!): DeletePayload!
  addProjectLabel(projectId: UUID!, labelId: UUID!): ProjectLabelLinkPayload!
  removeProjectLabel(projectId: UUID!, labelId: UUID!): DeletePayload!

  # ---- relations

  createIssueRelation(issueId: UUID!, relatedIssueId: UUID!, type: RelationType!, clientId: UUID, opId: UUID): IssueRelationPayload! @idempotent
  deleteIssueRelation(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  # ---- subscriptions and the inbox

  setIssueSubscription(issueId: UUID!, subscribed: Boolean!): SubscriptionPayload!
  markNotificationRead(id: UUID!, read: Boolean!): NotificationPayload!
  markAllNotificationsRead: NotificationsPayload!
  snoozeNotification(id: UUID!, until: Time): NotificationPayload!
  deleteNotification(id: UUID!): DeletePayload!

  # ---- views, preferences and favourites

  createView(input: CreateViewInput!): ViewPayload!
  updateView(input: UpdateViewInput!): ViewPayload!
  deleteView(id: UUID!): DeletePayload!
  setViewPreference(viewKey: String!, display: JSON!): ViewPreferencePayload!

  addFavorite(kind: FavoriteKind!, targetId: UUID!, afterFavoriteId: UUID): FavoritePayload!
  removeFavorite(kind: FavoriteKind!, targetId: UUID!): DeletePayload!

  # ---- templates

  createIssueTemplate(input: CreateIssueTemplateInput!): IssueTemplatePayload!
  updateIssueTemplate(input: UpdateIssueTemplateInput!): IssueTemplatePayload!
  """Retires a template, or brings one back."""
  archiveIssueTemplate(id: UUID!, archived: Boolean!): DeletePayload!

  createFormTemplate(input: CreateFormTemplateInput!): FormTemplatePayload!
  updateFormTemplate(input: UpdateFormTemplateInput!): FormTemplatePayload!
  archiveFormTemplate(id: UUID!, archived: Boolean!): DeletePayload!
  createFormTemplateField(input: CreateFormTemplateFieldInput!): FormTemplateFieldPayload!
  updateFormTemplateField(input: UpdateFormTemplateFieldInput!): FormTemplateFieldPayload!
  deleteFormTemplateField(id: UUID!): DeletePayload!

  createProjectTemplate(input: CreateProjectTemplateInput!): ProjectTemplatePayload!
  updateProjectTemplate(input: UpdateProjectTemplateInput!): ProjectTemplatePayload!
  archiveProjectTemplate(id: UUID!, archived: Boolean!): DeletePayload!
  createProjectTemplateMilestone(input: CreateProjectTemplateMilestoneInput!): ProjectTemplateMilestonePayload!
  updateProjectTemplateMilestone(input: UpdateProjectTemplateMilestoneInput!): ProjectTemplateMilestonePayload!
  deleteProjectTemplateMilestone(id: UUID!): DeletePayload!
  createProjectTemplateIssue(input: CreateProjectTemplateIssueInput!): ProjectTemplateIssuePayload!
  updateProjectTemplateIssue(input: UpdateProjectTemplateIssueInput!): ProjectTemplateIssuePayload!
  deleteProjectTemplateIssue(id: UUID!): DeletePayload!

  createRecurringIssue(input: CreateRecurringIssueInput!): RecurringIssuePayload!
  updateRecurringIssue(input: UpdateRecurringIssueInput!): RecurringIssuePayload!
  """Retires a schedule, or brings one back. Does not archive the issues it already minted."""
  archiveRecurringIssue(id: UUID!, archived: Boolean!): DeletePayload!

  # ---- projects

  createProject(input: CreateProjectInput!, clientId: UUID, opId: UUID): ProjectPayload! @idempotent
  updateProject(input: UpdateProjectInput!, clientId: UUID, opId: UUID): ProjectPayload! @idempotent
  deleteProject(id: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent
  restoreProject(id: UUID!, clientId: UUID, opId: UUID): ProjectPayload! @idempotent

  addProjectTeam(projectId: UUID!, teamId: UUID!, clientId: UUID, opId: UUID): ProjectTeamPayload! @idempotent
  removeProjectTeam(projectId: UUID!, teamId: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent
  addProjectMember(projectId: UUID!, userId: UUID!, clientId: UUID, opId: UUID): ProjectMemberPayload! @idempotent
  removeProjectMember(projectId: UUID!, userId: UUID!, clientId: UUID, opId: UUID): DeletePayload! @idempotent

  createProjectMilestone(input: CreateProjectMilestoneInput!, clientId: UUID, opId: UUID): ProjectMilestonePayload! @idempotent
