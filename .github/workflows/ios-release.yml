# The TestFlight upload.
#
# Split from ios.yml rather than added to it, and not for tidiness. ios.yml filters its push
# trigger by `paths: ['ios/**']`, and GitHub applies a paths filter to tag pushes as well as
# branch pushes — so a release tag cut from a commit that happens not to touch ios/ would
# match the tag and fail the path test, and the workflow would never start. A release that
# silently does not run is the failure this repo has already been bitten by once: the deploy
# job in ci.yml carries a comment about production sitting two tags behind main with nothing
# saying so. A tags-only trigger with no paths filter cannot miss.
#
# What this needs from the project, all of which already existed before this file:
#
#   * `ios/ExportOptions.plist` — method app-store-connect, manual signing, the "Apple
#     Distribution" certificate and the "Polaris App Store" profile.
#   * The Release configuration in `project.yml`, which is CODE_SIGN_STYLE: Manual against
#     the same identity.
#   * `ios/scripts/asc-setup.py`, which registered the bundle id and that provisioning
#     profile in App Store Connect.
#
# What it needs from repository secrets — the same three the desktop notarisation already
# uses, no new ones:
#
#   APPLE_API_KEY_PATH   the App Store Connect .p8 private key
#   APPLE_API_KEY_ID     its key id
#   APPLE_API_ISSUER     the issuer id
#
# One caveat, stated here because the failure is otherwise cryptic. Those secrets were added
# for notarisation, which needs only the Developer role. Creating or downloading an iOS
# distribution signing asset needs App Manager. If the key is notarisation-scoped, the
# archive step fails at signing with "No signing certificate ... found" or an authentication
# error from the provisioning update — that is not a bug in this file, it is the key's role,
# and the fix is a wider key rather than a change here.
#
# This job deliberately does not degrade gracefully when a secret is missing. desktop.yml
# unsets its Apple variables and builds unsigned, which is right for a build that is still
# useful unsigned; an upload is not. A release that reports success having uploaded nothing
# is worse than a red X, so the first step fails loudly instead.
name: iOS release

on:
  push:
    tags: ['v*']
  # So a failed upload can be retried against the same tag without cutting another one.
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion to upload. Defaults to the value in project.yml. TestFlight refuses a build number it has already seen, so a retry after a partial upload needs a new one.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload to TestFlight
    # macos-26 for Xcode 26, matching ios.yml: the package compiles under the Swift 6
    # language mode, which the older images do not offer.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Check the signing credentials are present
        env:
          KEY: ${{ secrets.APPLE_API_KEY_PATH }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEY" ]    || missing+=(APPLE_API_KEY_PATH)
          [ -n "$KEY_ID" ] || missing+=(APPLE_API_KEY_ID)
          [ -n "$ISSUER" ] || missing+=(APPLE_API_ISSUER)
          # The distribution identity is a separate requirement and the one that is easy to
          # believe you already have. -allowProvisioningUpdates fetches the *certificate*
          # from App Store Connect, and a certificate without its private key signs nothing;
          # the private key exists only in the keychain whose CSR created it. No API role
          # substitutes for it. Getting this wrong fails ten minutes in, with
          # `No signing certificate "iOS Distribution" found ... with a private key`, which
          # reads like a missing certificate and is a missing key.
          [ -n "$P12" ]    || missing+=(IOS_DIST_P12)
          [ -n "$P12_PW" ] || missing+=(IOS_DIST_P12_PASSWORD)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing App Store Connect secrets: ${missing[*]}. Nothing can be uploaded; failing rather than reporting a release that did not happen. Run \`make release-secrets ARGS=--set\` on a machine with the key, or see docs/05-infrastructure/12-release-secrets.md."
            exit 1
          fi

      # xcodebuild and altool both look for the key in this directory, by this filename. The
      # secret may hold the PEM text or a base64 blob of it depending on how it was pasted,
      # so both are accepted — and anything else fails here, where the message can say so,
      # rather than inside xcodebuild as an opaque authentication error.
      - name: Materialise the App Store Connect key
        env:
          KEY: ${{ secrets.APPLE_API_KEY_PATH }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$dir"
          out="$dir/AuthKey_${KEY_ID}.p8"
          if printf '%s' "$KEY" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$KEY" > "$out"
          else
            printf '%s' "$KEY" | base64 --decode > "$out" 2>/dev/null || {
              echo "::error::APPLE_API_KEY_PATH is neither PEM text nor base64. It must be the contents of the .p8 key, not a path."
              exit 1
            }
          fi
          if ! grep -q 'BEGIN PRIVATE KEY' "$out"; then
            echo "::error::The decoded App Store Connect key is not a private key."
            exit 1
          fi
          chmod 600 "$out"
          echo "ASC_KEY_PATH=$out" >> "$GITHUB_ENV"

      # The distribution identity, into a keychain of this run's own.
      #
      # Not the login keychain: a runner is shared infrastructure and a signing key left in
      # a default keychain outlives the job that needed it. This one is created here, given
      # a random password, and dies with the runner.
      #
      # set-key-partition-list is the step whose absence produces the strangest failure:
      # without it codesign finds the key, macOS prompts for permission to use it, there is
      # nobody to answer, and the build hangs until the job times out.
      - name: Import the distribution identity
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/polaris-signing.keychain-db"
          pw=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')

          security create-keychain -p "$pw" "$keychain"
          # Default is a five-minute lock timeout, which is shorter than an archive.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pw" "$keychain"

          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12" 2>/dev/null || {
            echo "::error::IOS_DIST_P12 is not base64. Export with: base64 -i dist.p12 | gh secret set IOS_DIST_P12"
            exit 1
          }
          if ! security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$P12_PW" \
                 -T /usr/bin/codesign -T /usr/bin/security 2>"$RUNNER_TEMP/import.err"; then
            # Overwhelmingly a passphrase mismatch: the .p12 was exported with one -P value
            # and IOS_DIST_P12_PASSWORD holds another. `security` reports it as
            # "MAC verification failed", which names the symptom and not the cause.
            if grep -qi 'MAC verification\|password' "$RUNNER_TEMP/import.err"; then
              echo "::error::Could not decrypt IOS_DIST_P12. IOS_DIST_P12_PASSWORD does not match the passphrase the .p12 was exported with (security export -P ...). Re-export and set both together."
            else
              echo "::error::Could not import IOS_DIST_P12:"
              cat "$RUNNER_TEMP/import.err"
            fi
            exit 1
          fi
          rm -f "$RUNNER_TEMP/dist.p12"

          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$keychain" >/dev/null
          # The search list, so xcodebuild looks here at all. Keeping login.keychain-db in
          # it leaves the runner's own tooling working.
          security list-keychain -d user -s "$keychain" login.keychain-db

          found=$(security find-identity -v -p codesigning "$keychain" | grep -c 'Apple Distribution' || true)
          if [ "$found" -eq 0 ]; then
            echo "::error::No 'Apple Distribution' identity in the imported .p12. Export the identity — certificate *and* private key — not just the certificate."
            security find-identity -v -p codesigning "$keychain" || true
            exit 1
          fi
          echo "imported $found Apple Distribution identity(ies)"

          # An Apple distribution certificate lasts a year. When it lapses the archive fails
          # exactly as it does with no certificate at all — ten minutes in, complaining
          # about a missing signing certificate — and the cause is a date. Saying so on
          # every release means the renewal is scheduled rather than discovered.
          end=$(security find-certificate -c 'Apple Distribution' -p "$keychain" \
                | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2 || true)
          if [ -n "$end" ]; then
            left=$(( ( $(date -j -f '%b %e %T %Y %Z' "$end" +%s 2>/dev/null || echo 0) - $(date +%s) ) / 86400 ))
            echo "certificate expires $end ($left days)"
            if [ "$left" -lt 0 ]; then
              echo "::error::The distribution certificate expired on $end. Renew it in the Apple Developer portal, then re-export IOS_DIST_P12."
              exit 1
            elif [ "$left" -lt 45 ]; then
              echo "::warning::The distribution certificate expires in $left days ($end). Renew it and re-export IOS_DIST_P12 before it lapses — once it does, every release fails at the archive."
            fi
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # The version, before the project is generated, because both keys are project
      # settings that xcodegen bakes into Info.plist.
      #
      # Until this step existed the tag decided *when* a build was uploaded and nothing
      # about *what* it was: project.yml carried a literal MARKETING_VERSION, so cutting
      # v0.9.0 from a tree whose manifest still said 0.8.0 would have shipped a TestFlight
      # build called 0.8.0. And CURRENT_PROJECT_VERSION was a hand-bumped literal, so the
      # second tag cut without somebody remembering to edit it dies at the end of a
      # ten-minute archive on "The bundle version must be higher than the previously
      # uploaded version" — the tag spent, the upload gone, nothing wrong with the code.
      #
      # The build number comes from github.run_number, which is monotonic per workflow and
      # never repeats, so a retry against the same tag gets a fresh one for free. The
      # explicit input still wins, for the case where TestFlight has already seen a run
      # number because an upload half-succeeded.
      - name: Stamp the version from the tag
        env:
          OVERRIDE: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        working-directory: ios
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            marketing="${GITHUB_REF_NAME#v}"
            # CFBundleShortVersionString is one to three dot-separated integers and nothing
            # else. App Store Connect rejects `0.9.0-rc1` on submission rather than on
            # upload, which is late and confusing, so a tag that cannot be a marketing
            # version is refused here where the message can say why.
            if ! [[ "$marketing" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not yield a usable CFBundleShortVersionString ($marketing). Release tags must be vMAJOR.MINOR.PATCH."
              exit 1
            fi
            sed -i '' -E "s/^( *MARKETING_VERSION: ).*/\1\"$marketing\"/" project.yml
          fi

          build="${OVERRIDE:-$RUN_NUMBER}"
          sed -i '' -E "s/^( *CURRENT_PROJECT_VERSION: ).*/\1\"$build\"/" project.yml

          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION' project.yml

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # PolarisCore's tests run here too. ios.yml already ran them on the pull request, but a
      # tag can be cut from any commit, and shipping a build whose core suite was never run
      # against this exact tree is how a release becomes the first place a regression is seen.
      - name: Test PolarisCore
        working-directory: ios/PolarisCore
        run: swift test

      # -allowProvisioningUpdates with the API key is what lets a headless runner obtain the
      # distribution certificate and the "Polaris App Store" profile. Without it, signing on
      # a fresh runner has nothing in its keychain to sign with.
      - name: Archive
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild archive \
            -project Polaris.xcodeproj \
            -scheme Polaris \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Polaris.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      - name: Export the .ipa
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Polaris.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"

      # --validate-app first: it catches a bad Info.plist, a missing icon or an entitlement
      # mismatch in seconds, where the same faults surface from the upload as an email some
      # minutes later and leave the build number spent.
      - name: Validate
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --validate-app \
            -f build/export/Polaris.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER"

      - name: Upload to TestFlight
        working-directory: ios
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app \
            -f build/export/Polaris.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER"

      # The archive carries the dSYMs. Keeping it is what makes a crash report from a tester
      # symbolicable weeks later, once the runner is long gone.
      - name: Keep the archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: ios/build/Polaris.xcarchive
          if-no-files-found: ignore
