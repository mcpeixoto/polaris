# Did the release actually ship?
#
# A tag fans out to three workflows that know nothing about each other: ci.yml deploys the
# website, desktop.yml builds and publishes the installers, ios-release.yml uploads to
# TestFlight. Each reports its own success. Nothing has ever reported whether *the release*
# happened, and the difference is not academic — v0.8.0 published four platforms' installers
# while the website was never redeployed and no iOS build was uploaded, and every workflow
# involved was green or failed in isolation where nobody was looking.
#
# This is the one place to look. It waits for the other runs on this exact tag, then checks
# the outcome rather than the job: the release is published and holds installers, production
# is serving this tag's commit, TestFlight took a build. It fails when a surface did not
# ship, so "the tag is green" and "users can get it" become the same statement.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to re-check, e.g. v0.8.0.'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Every surface shipped
    runs-on: ubuntu-latest
    # Long enough for the macOS desktop build and the iOS archive, which are the slow ones.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the tag
        id: t
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          sha=$(git rev-list -n1 "$tag")
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "sha=$sha"   >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Verifying $tag ($sha)"

      # Waiting on the other workflows by head_sha rather than by name-and-hope. A run that
      # has not appeared yet is not the same as a run that failed, so absence is retried
      # until the timeout rather than reported as a failure on the first poll.
      - name: Wait for the other workflows on this tag
        id: runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          set -uo pipefail
          want="CI Desktop iOS release"
          deadline=$(( $(date +%s) + 75*60 ))
          while :; do
            # By tag ref, not by commit. Now that a tag deploys, a merge and the tag cut
            # from it share a sha, so `--commit` returns two CI runs — the merge's and the
            # tag's — and the newest is not reliably the one this job is verifying.
            # `--branch` on a tag push matches the tag name exactly.
            runs=$(gh run list --branch "$TAG" --limit 50 \
                   --json workflowName,status,conclusion,databaseId)
            pending=""
            for w in CI Desktop "iOS release"; do
              row=$(jq -r --arg w "$w" '[.[]|select(.workflowName==$w)][0] // empty' <<<"$runs")
              [ -z "$row" ] && { pending="$pending $w(absent)"; continue; }
              [ "$(jq -r .status <<<"$row")" != completed ] && pending="$pending $w(running)"
            done
            [ -z "$pending" ] && break
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "::error::Timed out waiting for:$pending"
              exit 1
            fi
            echo "waiting for:$pending"
            sleep 30
          done
          echo "$runs" | jq -r '.[]|"\(.workflowName)\t\(.conclusion)"'
          echo "$runs" > /tmp/runs.json

      # From here on the checks are about outcomes, not about job status. A job can be green
      # having skipped the step that mattered, and a job can be red for a reason that did not
      # stop the release.
      - name: The installers are published and downloadable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          set -euo pipefail
          rel=$(gh release view "$TAG" --json isDraft,assets)
          if [ "$(jq -r .isDraft <<<"$rel")" != false ]; then
            echo "::error::$TAG is still a draft. Nobody outside this repository can download it, and electron-updater will not see it."
            exit 1
          fi
          names=$(jq -r '.assets[].name' <<<"$rel")
          echo "$names"
          for want in '\.dmg$' '\.exe$' '\.AppImage$' '^latest\.yml$' '^latest-mac\.yml$' '^latest-linux\.yml$'; do
            grep -qE "$want" <<<"$names" || { echo "::error::$TAG has no asset matching $want"; exit 1; }
          done
          # The version in the filenames must be the tag's, not whatever package.json held.
          v="${TAG#v}"
          grep -q "$v" <<<"$names" || { echo "::error::No asset carries version $v — the build did not take its version from the tag."; exit 1; }

      # An asset existing and its URL resolving are different claims, and the second is the
      # one anybody depends on. These are the links the landing page, the README and any
      # support reply point at; if the redirect does not resolve, every one of them is a 404
      # and the release page still looks perfectly fine.
      #
      # Only meaningful after the draft is cleared — /releases/latest/ does not resolve to a
      # draft — which is why this runs here, after the Desktop workflow has completed.
      - name: The permanent download links resolve
        env:
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          set -euo pipefail
          fail=0
          for f in Polaris-mac-arm64.dmg Polaris-mac-x64.dmg Polaris-Setup.exe \
                   Polaris-linux-x86_64.AppImage polaris-amd64.deb; do
            url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/$f"
            code=$(curl -sSIL -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url" || echo 000)
            echo "$code  $f"
            [ "$code" = 200 ] || fail=1
          done
          if [ $fail -ne 0 ]; then
            echo "::error::A permanent download link does not resolve. Every download button on the landing page points at these."
            exit 1
          fi

      - name: Production is serving this commit
        env:
          URL: ${{ secrets.DEPLOY_BASE_URL || 'https://polaris.peixotolabs.com' }}
          SHORT: ${{ steps.t.outputs.short }}
        run: |
          set -euo pipefail
          got=$(curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "$URL/deployment")
          echo "$got"
          rev=$(jq -r .revision <<<"$got")
          if [ "$rev" != "$SHORT" ]; then
            echo "::error::$URL is serving $rev, not $SHORT. The tag did not reach the website."
            exit 1
          fi
          [ "$(jq -r .env <<<"$got")" = production ] || { echo "::error::Not configured as production."; exit 1; }

      # This asserts the iOS job succeeded, which is necessary and has twice not been
      # sufficient. v0.9.0 passed it with a build belonging to no group; v0.10.0 passed it
      # with the *previous release's* build distributed instead of its own, because the
      # script took the newest build in the list and App Store Connect had not yet listed
      # the one just uploaded. Both times the job was green and the release had not shipped.
      #
      # So the job's word is checked first, and then App Store Connect is asked directly,
      # below. A verifier that only reads job conclusions verifies nothing a job can lie
      # about.
      - name: A build reached testers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          c=$(jq -r '[.[]|select(.workflowName=="iOS release")][0].conclusion' /tmp/runs.json)
          if [ "$c" != success ]; then
            echo "::error::The iOS release run concluded '$c'. No build reached TestFlight. See docs/05-infrastructure/12-release-secrets.md."
            exit 1
          fi

      # The check that would have caught both failures: is there a build carrying THIS tag's
      # version, and can anybody actually install it?
      - name: The TestFlight build for this tag is installable
        env:
          ASC_KEY: ${{ secrets.APPLE_API_KEY_PATH }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WANT: ${{ steps.t.outputs.tag }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyjwt cryptography \
            || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pyjwt cryptography
          python3 - <<'PY'
          import os, sys, time, json, urllib.request, jwt
          want = os.environ["WANT"].lstrip("v")
          now = int(time.time())
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER"], "iat": now, "exp": now + 600,
                            "aud": "appstoreconnect-v1"}, os.environ["ASC_KEY"],
                           algorithm="ES256",
                           headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          def get(p):
              r = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/" + p,
                                         headers={"Authorization": "Bearer " + tok})
              return json.load(urllib.request.urlopen(r))
          app = get("apps?filter[bundleId]=com.peixotolabs.polaris")["data"][0]["id"]
          r = get(f"builds?filter[app]={app}&limit=20&sort=-uploadedDate"
                  "&include=preReleaseVersion,betaGroups")
          inc = {i["id"]: i for i in r.get("included", [])}
          for d in r["data"]:
              pv = d["relationships"]["preReleaseVersion"]["data"]
              ver = inc[pv["id"]]["attributes"]["version"] if pv and pv["id"] in inc else ""
              if ver != want:
                  continue
              groups = [inc[g["id"]]["attributes"]["name"]
                        for g in (d["relationships"]["betaGroups"]["data"] or [])
                        if g["id"] in inc]
              num, state = d["attributes"]["version"], d["attributes"]["processingState"]
              if not groups:
                  print(f"::error::Build {num} is version {want} and {state}, but belongs to "
                        f"no beta group — invisible in the TestFlight app to every tester.")
                  sys.exit(1)
              print(f"build {num} ({state}) available to: {', '.join(groups)}")
              sys.exit(0)
          print(f"::error::No TestFlight build for version {want}. The upload job was green, "
                f"so it uploaded something else or nothing.")
          sys.exit(1)
          PY

      - name: Summary
        if: always()
        env:
          TAG: ${{ steps.t.outputs.tag }}
          SHORT: ${{ steps.t.outputs.short }}
        run: |
          {
            echo "## $TAG — $SHORT"
            echo
            jq -r '.[]|"- \(.workflowName): \(.conclusion)"' /tmp/runs.json 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
