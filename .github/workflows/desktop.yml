# Desktop builds: macOS, Windows and Linux.
#
# Split from ci.yml because it is a different kind of job. CI runs on every push and has to
# be fast; this downloads a hundred megabytes of Electron per platform, runs three OS
# runners, and is only interesting when a release is being cut or when somebody has touched
# the shell.
#
# Each platform builds on its own runner rather than cross-compiling. electron-builder *can*
# produce a Windows installer from Linux with wine, and the result is the kind of artefact
# that works until the day it does not — an unsigned NSIS built through an emulation layer
# is not what you want to discover is broken from a user's bug report. The macOS build has
# no choice in the matter: codesign and notarytool only exist on macOS.

name: Desktop

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'desktop/**'
      - 'web/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      # The renderer too, and not for symmetry. The smoke test is the only check that catches
      # a CSP violation, and a CSP violation is a *renderer* change — a new font host, a new
      # connect-src target, an inline worker. Without this the one check that can fail on it
      # only runs after the merge, on main, in a workflow nobody is watching.
      - 'web/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write # needed to attach artefacts to a release

jobs:
  # Creates the draft release before any platform can, and exists solely to stop the three
  # build jobs racing to create it themselves.
  #
  # electron-builder's GitHub publisher looks for a release matching the tag and creates one
  # only if it finds none. That is check-then-create, and the three platforms run it
  # concurrently — so two of them can both find nothing and both create. GitHub permits it,
  # because a *draft* is not bound to its tag: the result is two draft releases with the same
  # tag_name, each holding the artefacts of whichever jobs happened to land on it.
  #
  # That is exactly how v0.2.0 shipped: one draft with the macOS and Linux artefacts, a second
  # with `Polaris-Setup-0.2.0.exe`, `latest.yml` and one stray macOS blockmap. Every job
  # reported success, the workflow was green, and the release a user would have downloaded had
  # no Windows installer in it. v0.1.1 raced the same way and happened to win, which is worse
  # than failing — it means the bug is invisible until the run where it is not.
  #
  # With the release already present, all three publishers take the "found it" branch and
  # there is nothing left to race over.
  release:
    name: Prepare the draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release if it does not exist
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent on purpose: a re-run of a partly-finished tag must reuse the release it
        # already made rather than adding another one beside it.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — reusing it"
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    name: ${{ matrix.name }}
    # Runs on pull requests too, where the job above does nothing — `needs` still orders them,
    # and a job whose only step is skipped still succeeds, so nothing here is gated on a tag.
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: knowing that Windows is broken and
      # macOS is fine is most of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            target: --mac
          - name: Windows
            os: windows-2022
            target: --win
          - name: Linux
            os: ubuntu-24.04
            target: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # electron-builder takes the version from package.json and nowhere else. Without this
      # the tag `v0.4.0` ships `Polaris-0.0.0.dmg` and a `latest-mac.yml` that says 0.0.0 —
      # so every installed copy compares its own 0.0.0 against a published 0.0.0, finds no
      # update, and the release reaches nobody who already had the app.
      - name: Stamp the version from the tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        working-directory: desktop
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.argv[1].replace(/^v/, "");
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("packaging version", pkg.version);
          ' "$GITHUB_REF_NAME"

      # The renderer is built ONCE and copied into every package, rather than each platform
      # building its own. Building it three times invites three different bundles from one
      # commit — and the desktop app being a build behind the web app is exactly the drift
      # the shared-bundle design exists to prevent.
      - name: Build the renderer
        run: pnpm --filter @polaris/web build

      - name: Build the Electron shell
        run: pnpm --filter @polaris/desktop build:electron

      # Icons are generated from one source rather than committed as three binaries that
      # can disagree. Pillow is the only thing this needs; see desktop/assets/make-icon.py
      # for why it is not an SVG rasterised at build time.
      #
      # The retry is for PEP 668: a distribution-managed Python refuses `pip install` into
      # its own site-packages, and the runner image that grows that behaviour would otherwise
      # break this step on a day nobody touched it.
      - name: Generate icons
        shell: bash
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow \
            || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages pillow
          python3 desktop/assets/make-icon.py
          python3 desktop/assets/make-tray.py

      - name: Package (unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: desktop
        # A pull request gets an unsigned build, because signing certificates are not
        # available to forks and a workflow that fails for every outside contributor is one
        # that gets ignored. It still proves the thing that usually breaks: that the package
        # assembles and the renderer lands where the main process looks for it.
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package and sign
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        working-directory: desktop
        shell: bash
        # An undefined secret is not an absent environment variable: GitHub sets it to the
        # empty string. electron-builder treats a *defined* CSC_LINK as a path to a
        # certificate, resolves "" against the working directory, and dies with
        # `<repo>/desktop not a file` — a message that reads like a packaging bug and is
        # really a missing secret. The empty ones are dropped here rather than removed from
        # `env:` below, so that adding the secret in repository settings is the only thing
        # needed to turn signing on; nothing in this file has to change with it.
        run: |
          # The Apple certificate is for the Apple build and nothing else.
          #
          # CSC_LINK is not a macOS variable — Windows reads it too, imports whatever it
          # points at, and hands the lot to signtool. The .p12 exported from a login keychain
          # holds every identity on it, so signtool found several and refused to choose:
          # "Multiple certificates were found that meet all the given criteria". The Windows
          # build had been fine while this secret was empty and broke the moment it was set.
          if [ "$RUNNER_OS" != macOS ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            # Otherwise electron-builder searches the runner keychain, finds nothing, and
            # reports the absence as a signing failure instead of skipping.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          # notarytool wants a *path* to the .p8, and the secret holds the key itself.
          #
          # The name says PATH because ios-release.yml materialises it to a file and that is
          # what App Store Connect tooling reads. electron-builder passes APPLE_API_KEY
          # straight through as a command-line option, so the PEM text arrived as an option
          # and notarytool answered "Invalid option:" followed by the key — a redacted `***`
          # in the log, which is the least useful message it could have produced. The app was
          # correctly signed by then; only the ticket was missing.
          if [ -n "${APPLE_API_KEY:-}" ] && [ ! -f "${APPLE_API_KEY}" ]; then
            key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            if printf '%s' "$APPLE_API_KEY" | grep -q 'BEGIN PRIVATE KEY'; then
              printf '%s\n' "$APPLE_API_KEY" > "$key"
            else
              printf '%s' "$APPLE_API_KEY" | base64 --decode > "$key" 2>/dev/null || {
                echo "::error::APPLE_API_KEY_PATH is neither PEM text nor base64."
                exit 1
              }
            fi
            chmod 600 "$key"
            export APPLE_API_KEY="$key"
            echo "notarisation key written to a file for notarytool"
          fi

          if [ -z "${APPLE_API_KEY:-}" ]; then
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          if [ -z "${AZURE_TENANT_ID:-}" ]; then
            unset AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET
          fi
          pnpm exec electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: a Developer ID certificate, and an App Store Connect key for notarisation.
          # Without notarisation Gatekeeper refuses to open the app at all on any machine
          # that did not build it — an unnotarised .dmg is not a release, it is a demo.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows: since June 2023 a code-signing key may not sit on disk, so this is
          # cloud signing against an HSM rather than a .pfx in a secret.
          #
          # These three are credentials, not configuration, and on their own they sign
          # nothing: electron-builder only reaches for Azure Trusted Signing when
          # `win.azureSignOptions` names an endpoint, an account and a certificate profile.
          # Until that block exists in electron-builder.yml this step logs "no signing info
          # identified, signing is skipped" and produces an unsigned installer under a step
          # called "Package and sign". Verified by running the same build locally.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # "Package and sign" is a step name, not a result.
      #
      # When CSC_LINK is absent it unsets the signing variables and builds anyway — right for
      # a build that is still useful unsigned, and the reason the mac builds shipped unsigned
      # for weeks under a step called "sign" while every job stayed green.
      #
      # What is checked is the .app, and it took two wrong guesses to get there. The first
      # version searched for `Polaris.app` and found nothing, because electron-builder writes
      # `polaris.app` in lower case and `find -name` is case-sensitive. The second checked
      # the .dmg instead and failed with "code object is not signed at all", which is simply
      # true: electron-builder signs and staples the application, not the disk image that
      # carries it. Both times the build was correct and the check was not.
      - name: Verify the macOS build is signed and notarised
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.name == 'macOS' }}
        shell: bash
        env:
          HAVE_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
        run: |
          set -uo pipefail

          # Before looking for anything: without a certificate the build is legitimately
          # unsigned and there is nothing here to assert.
          if [ "$HAVE_CERT" != true ]; then
            echo "::warning::MAC_CERT_P12 is not set, so this build is unsigned and Gatekeeper will refuse it on any machine that did not build it. Run \`make release-secrets ARGS=--set\` on a machine with the certificate."
            exit 0
          fi

          # -iname, and both arch directories. release/mac-arm64 and release/mac are what
          # electron-builder writes and what desktop/scripts/smoke.mjs already looks for.
          mapfile -t apps < <(find desktop/release -maxdepth 2 -iname 'polaris.app' -type d)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No .app under desktop/release to verify. Contents:"
            ls -la desktop/release || true
            exit 1
          fi

          fail=0
          for app in "${apps[@]}"; do
            echo "=== $app ==="

            if ! codesign --verify --deep --strict --verbose=2 "$app" 2>&1; then
              echo "::error::$app is not validly signed."
              fail=1
              continue
            fi

            # A development certificate verifies perfectly on the machine that holds it and
            # is refused on every other one, which is the failure that looks like success.
            if ! codesign -dvv "$app" 2>&1 | grep -q 'Authority=Developer ID Application'; then
              echo "::error::$app is signed, but not by a Developer ID Application certificate. Gatekeeper will refuse it."
              codesign -dvv "$app" 2>&1 | grep -E 'Authority|TeamIdentifier' || true
              fail=1
              continue
            fi

            # The ticket, stapled into the bundle. Without it the app still needs to reach
            # Apple on first launch, and fails closed on a machine that is offline.
            if ! xcrun stapler validate "$app" 2>&1; then
              echo "::error::$app carries no notarisation ticket."
              fail=1
              continue
            fi

            # The only question a user asks.
            if ! spctl --assess --type execute --verbose=4 "$app" 2>&1; then
              echo "::error::Gatekeeper rejects $app."
              fail=1
              continue
            fi
            echo "signed, notarised, stapled, and accepted by Gatekeeper"
          done
          exit $fail

      # A permanent URL to each installer.
      #
      # electron-builder stamps the version into every asset name, so
      # `Polaris-0.9.0-mac-arm64.dmg` is the only name a release has and there is no link
      # that keeps working. The landing page could therefore only point at the releases
      # page, which hands somebody who wanted the app a list of fifteen files.
      #
      # GitHub's `/releases/latest/download/<name>` redirect needs an exact filename, so the
      # fix is a second copy of each installer under a name with no version in it. These are
      # additional assets, never replacements: release.yml still asserts that some asset
      # carries the tag's version, which is what proves the build took its version from the
      # tag.
      #
      # They must stay out of `latest*.yml`, and this step cannot put them there — it copies
      # files and uploads them, and never regenerates a manifest. That matters more than it
      # looks: electron-updater picks a macOS update by substring from the manifest's `files`
      # list, preferring URLs containing "arm64" on Apple Silicon and excluding them
      # everywhere else. An extra file inside that list could hand every Mac the wrong build,
      # silently, forever. An extra file merely *on the release* is invisible to it. That is
      # also why the .zip files — the ones macOS actually updates from — get no alias here.
      - name: Publish stable-named copies of the installers
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        working-directory: desktop/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Exactly one match, or fail. A zero-match would publish a release whose stable
          # link 404s — and the landing page points at that link, so the first person to
          # notice would be a user. A two-match would pick arbitrarily between them.
          copy() {
            local matches=( $1 )
            if [ ${#matches[@]} -ne 1 ]; then
              echo "::error::Expected exactly one file matching '$1' in desktop/release, found ${#matches[@]}: ${matches[*]:-none}"
              ls -1
              exit 1
            fi
            cp "${matches[0]}" "$2"
            gh release upload "$GITHUB_REF_NAME" "$2" --clobber
            echo "$2  <-  ${matches[0]}"
          }

          # Globs end in the real extension so the .blockmap siblings never match. The
          # Windows installer is globbed loosely because its name on disk carries spaces
          # ("Polaris Setup 0.9.0.exe") while the uploaded asset does not.
          case "${{ matrix.name }}" in
            macOS)
              copy '*-mac-arm64.dmg'      Polaris-mac-arm64.dmg
              copy '*-mac-x64.dmg'        Polaris-mac-x64.dmg
              ;;
            Windows)
              copy '*Setup*.exe'          Polaris-Setup.exe
              ;;
            Linux)
              copy '*.AppImage'           Polaris-linux-x86_64.AppImage
              copy '*.deb'                polaris-amd64.deb
              ;;
          esac

      # The step that separates "it compiled" from "it is an application".
      #
      # An Electron shell fails in a way a build cannot see: the main process is ESM, half
      # its dependencies are CommonJS, and when that interop breaks it breaks at link time —
      # no window, no log, no non-zero exit, just a modal dialog on a machine with nobody in
      # front of it. Everything else here would still be green. So this launches the artefact
      # and asserts that React mounted something.
      #
      - name: Prepare Linux sandbox and display
        if: ${{ matrix.name == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libasound2t64
          # Ubuntu's AppArmor policy restricts unprivileged user namespaces. Use
          # Chromium's setuid sandbox on this ephemeral runner instead.
          sudo chown root:root desktop/release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 desktop/release/linux-unpacked/chrome-sandbox

      - name: Smoke-test the packaged app
        working-directory: desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a node scripts/smoke.mjs
          else
            node scripts/smoke.mjs
          fi

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: polaris-${{ matrix.name }}
          # The unpacked directory is deliberately excluded: it is several hundred megabytes
          # of Electron per platform and nobody downloads it from a CI run.
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  # The step that turns a build into a release.
  #
  # `release` above creates the GitHub release as a *draft*, and until now nothing ever
  # cleared that flag. Every tag this repo has cut — v0.6.2 through v0.7.3, six of them —
  # is still sitting as a draft: invisible on the releases page, undownloadable by anyone
  # without push access, and, worse, invisible to `electron-updater`. The updater asks the
  # GitHub API for the latest *published* release; a draft is not one, so every installed
  # copy has been checking for updates, being told there are none, and staying where it is.
  # The auto-update path has therefore never worked in production, and every job was green
  # the whole time, because "the artefacts uploaded" and "the release exists" are both true
  # of a draft.
  #
  # Gated on `needs: build`, which is the matrix. `fail-fast: false` lets the three
  # platforms finish independently, but `needs` still requires all of them to have
  # succeeded — so a tag where Windows failed publishes nothing, rather than publishing a
  # release whose Windows installer is missing. That is the v0.2.0 failure the `release`
  # job above was written to prevent, arriving from the other end.
  publish:
    name: Publish the release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the release back before publishing it rather than trusting that the build jobs
      # uploaded what they said they did. electron-builder's publisher is fire-and-forget:
      # a failed asset upload is logged and the step still exits zero, so the only honest
      # check is what the release actually holds now.
      #
      # The update manifests are checked by name because they are the files that make this
      # an auto-updating app rather than a download page. An installer with no `latest.yml`
      # beside it installs once and never updates again.
      - name: Check the release holds a full set of artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          echo "$assets"
          missing=()
          # The versioned artefacts, the update manifests, and the stable aliases the
          # website links to. A release missing an alias is one where every download button
          # on the landing page 404s.
          for want in '\.dmg$' '\.exe$' '\.AppImage$' '^latest\.yml$' '^latest-mac\.yml$' '^latest-linux\.yml$' \
                      '^Polaris-mac-arm64\.dmg$' '^Polaris-mac-x64\.dmg$' '^Polaris-Setup\.exe$' \
                      '^Polaris-linux-x86_64\.AppImage$' '^polaris-amd64\.deb$'; do
            grep -qE "$want" <<<"$assets" || missing+=("$want")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::$GITHUB_REF_NAME is missing: ${missing[*]}. Not publishing a partial release — a user who downloads it gets an app that cannot update itself."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate every installer and updater target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install 'PyYAML==6.0.3'
          gh release view "$GITHUB_REF_NAME" --json assets > /tmp/desktop-release.json
          gh release download "$GITHUB_REF_NAME" --pattern 'latest*.yml' --dir /tmp/desktop-manifests
          python scripts/verify-desktop-release.py "$GITHUB_REF_NAME" /tmp/desktop-release.json /tmp/desktop-manifests

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --latest=true is explicit: GitHub only moves the "Latest" pointer on its own when
        # it judges the tag newest by semver, and this is the pointer the download page and
        # every "latest release" link resolve through.
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          gh release view "$GITHUB_REF_NAME" --json isDraft,url --jq '"published: \(.isDraft == false)  \(.url)"'
