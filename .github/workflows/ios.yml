# iOS client build and tests.
#
# Split from ci.yml for the same reason desktop.yml is: this needs a macOS runner and an Xcode
# toolchain, which the Go and web jobs do not, and it is only interesting when somebody has
# touched the iOS client.
name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    # macos-26 for Xcode 26. The Swift 6 language mode and strict concurrency this package
    # compiles under are not available on the older runner images.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      # The whole testable surface lives in the PolarisCore package and is platform-portable
      # on purpose, so it runs here with no simulator in the loop — seconds rather than the
      # minutes an xcodebuild test destination costs.
      - name: Test PolarisCore
        working-directory: ios/PolarisCore
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is generated, not committed. Generating it here is also the check that
      # project.yml is valid — a malformed manifest fails at this step rather than as a
      # confusing build error later.
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # A booted simulator, chosen from whatever the runner image ships rather than a name
      # pinned here: the image's device list changes with every Xcode, and a pinned name
      # fails the whole job the day it disappears.
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true

      - name: Build for the simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project Polaris.xcodeproj \
            -scheme Polaris \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build-for-testing

      # The app-hosted unit tests and the UI smoke test. The bundle-level checks — the
      # version keys interpolating, the privacy manifest being copied, the URL scheme being
      # registered — only exist against the built product, and the smoke test is the one that
      # proves the fixture app still launches to a signed-in screen. The full QA sweeps stay a
      # local `xcodebuild test`: on this runner they cost twenty minutes for coverage the
      # PolarisCore suite already has host-side.
      - name: Run app-hosted tests
        working-directory: ios
        run: |
          xcodebuild \
            -project Polaris.xcodeproj \
            -scheme Polaris \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:PolarisTests \
            -only-testing:PolarisUITests/SmokeTests \
            -resultBundlePath build/results.xcresult \
            test-without-building

      - name: Keep the result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/build/results.xcresult
          if-no-files-found: ignore
