name: CI

# Fork PRs get no secrets. Everything below must pass without them — see
# docs/06-product-model/03-open-source-operations.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Superseded pull request runs are cancelled; runs on main are not.
#
# Cancelling everything was right when this workflow only reported. Now its last job
# deploys, and a second merge landing while the first is still running cancelled the first
# run *including its deploy* — which is how a merge silently never reaches production. It
# happened: #162 was cancelled by #163 eight minutes later.
#
# Production converges either way, because the newer run deploys a commit that contains the
# older one. What it does not survive is the newer run failing: prod would then sit on a
# commit two merges back with nothing saying so, and the cancelled run in between looks like
# an infrastructure hiccup rather than a skipped release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go — vet, import-lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris_test
        options: >-
          --health-cmd "pg_isready -U polaris"
          --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
      valkey:
        image: valkey/valkey:8.0-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://polaris:polaris@localhost:5432/polaris_test?sslmode=disable
      VALKEY_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - run: bash scripts/lint-imports.sh
      - run: go vet ./...
        working-directory: services
      - run: go test ./... -race -count=1
        working-directory: services

  # The enterprise edition, built and tested as its own job.
  #
  # It is separate from `go` rather than two extra steps inside it, because the two editions
  # are two artefacts: `ghcr.io/…/polaris` and `ghcr.io/…/polaris-ee`, built from this one
  # commit (docs/06-product-model/01-licensing-and-distribution.md). A tagged build that only
  # ran after the untagged one passed would be a check on the community image with an
  # afterthought attached, and the afterthought is the half that runs in production for every
  # paying customer.
  #
  # It exists at all because `//go:build ee` code is invisible to every other job here. It
  # does not compile under `go vet ./...`, it is not covered by `go test ./...`, and until
  # this job existed a syntax error in ee/ could be merged, tagged and shipped — discovered
  # by the release build, or by the cloud.
  go-ee:
    name: Go — the enterprise edition builds and passes its own tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris_test
        options: >-
          --health-cmd "pg_isready -U polaris"
          --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
      valkey:
        image: valkey/valkey:8.0-alpine
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://polaris:polaris@localhost:5432/polaris_test?sslmode=disable
      VALKEY_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      # Reads the linked dependency graph of both editions' binaries and fails if the
      # community ones contain commercially licensed code — or if the enterprise ones do
      # not, which would mean the tag had quietly stopped reaching anything.
      - run: bash scripts/lint-editions.sh
      - run: go vet -tags ee ./...
        working-directory: services
      - run: go test -tags ee ./... -race -count=1
        working-directory: services
      # The commercial module on its own terms. `go test` above runs it as a dependency of
      # services/, which compiles it but runs none of its own tests — they live in a
      # different module and `./...` does not cross a module boundary.
      - run: go test -tags ee ./... -count=1
        working-directory: ee

  generated:
    name: Generated code is not stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make generate
      - name: Fail if regeneration changed anything
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated code is stale. Run 'make generate' and commit."
            git diff --stat
            exit 1
          fi

  web:
    name: Web — typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx prettier --check "web/src/**/*.{ts,tsx,css}" "web/e2e/**/*.ts" "web/*.{ts,json}" "ee/web/**/*.{ts,tsx,css}" "desktop/src/**/*.{ts,cts}"
      - run: pnpm -C web typecheck
      # The enterprise resolution of `@ee`. tsconfig.json pins the alias to the stubs so that
      # the ordinary typecheck has something that always exists to check against — which
      # means the commercial modules are not compiled by the line above at all, and would
      # otherwise first be compiled inside the release build.
      - run: pnpm -C web typecheck:ee
      - run: pnpm -C web lint
      # An optimistic create under a stand-in id that nothing can pair with the server's row.
      # Five features shipped that independently and each was found by a user seeing their
      # own comment twice. `SyncEngine.mutate` asserts the same rule at runtime; this is the
      # half that reaches code no test runs.
      - run: node scripts/lint-optimistic-reconcile.mjs
      # The iOS client writes its GraphQL as Swift string literals, so a renamed field still
      # compiles and fails at runtime on a device, inside a 200 response. Nothing else in CI
      # reads those documents.
      - run: node scripts/lint-ios-graphql.mjs
      - run: pnpm -C web test -- --run
      # The same suite resolved against the commercial modules, plus their own specs.
      # A core run resolves `@ee` to the stubs, so without this the enterprise bundle's
      # components are never rendered by any test — and the bundle the cloud serves is the
      # enterprise one.
      - run: pnpm -C web test:ee
      # The community bundle, and then the assertion that it does not contain the
      # commercial one. This is the web half of scripts/lint-editions.sh: that script reads
      # the Go binaries' dependency graphs, and nothing until now read the JavaScript.
      #
      # The markers are derived rather than listed, so the check keeps working as ee/web
      # grows: every GraphQL operation name declared under ee/web must be absent from the
      # community bundle. A commercial module that leaked in through a stray import would
      # bring its documents with it, and operation names survive minification because they
      # are string literals sent to the server.
      - run: pnpm -C web build
      - name: Fail if the community bundle contains commercial code
        run: |
          set -euo pipefail
          # An operation DECLARATION: the keyword, a PascalCase name, then the variable
          # list or the selection set. The trailing bracket is what keeps English out —
          # "query into" and "query on" appear in the comments here, and `into` matches
          # somewhere in any bundle, which would fail this check for everybody forever.
          markers=$(grep -rhoE '\b(query|mutation) [A-Z][A-Za-z0-9_]*[[:space:]]*[({]' ee/web \
                      --include='*.ts' --include='*.tsx' \
                    | awk '{print $2}' | sed 's/[({].*//' | sort -u)
          if [ -z "$markers" ]; then
            echo "::error::found no operation names under ee/web, so this check is vacuous"
            exit 1
          fi
          failed=0
          for marker in $markers; do
            if grep -rlF "$marker" web/dist/assets; then
              echo "::error::the community bundle contains the ee operation ${marker}"
              failed=1
            fi
          done
          exit $failed
      # Proves the enterprise client actually bundles. `tsc` and vitest both accept a
      # missing CSS module import; only the bundler notices — see the note on `build-web`
      # in the Makefile, which is there because that exact state reached this repository.
      - run: POLARIS_EDITION=ee pnpm -C web build

  e2e:
    name: End-to-end — the browser-only acceptance tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_USER: polaris
          POSTGRES_PASSWORD: polaris
          POSTGRES_DB: polaris
        options: >-
          --health-cmd "pg_isready -U polaris"
          --health-interval 3s --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://polaris:polaris@localhost:5432/polaris?sslmode=disable
      POLARIS_ENV: development
      # Test-only, and obviously so. The real one lives in a root-owned file on the host.
      POLARIS_JWT_SECRET: ci-only-secret-not-used-anywhere-real-000000
      POLARIS_API_ADDR: 127.0.0.1:8088
      POLARIS_SYNC_ADDR: 127.0.0.1:8089
      POLARIS_PUBLIC_URL: http://localhost:5173
      POLARIS_E2E_API: http://localhost:8088
      # The suite creates an account per test, and the default — `invite` — admits exactly
      # two people: somebody holding an invitation, and the very first account on an empty
      # install. Without this the first test to run would take the founder slot and every
      # other one would fail on `POST /auth/register` with a 403 about invitations, which
      # reads like an application fault rather than a missing variable.
      #
      # The gate itself is not skipped by setting this. It is covered where it can be
      # covered honestly: services/internal/httpapi/register_gate_test.go for the refusal,
      # and web/e2e/invite.spec.ts for the way in, which is the same code path in either
      # mode — an invitation is redeemed on the register call whether or not open signup is
      # allowed.
      POLARIS_REGISTRATION_MODE: open
      # POLARIS_ENV=development would otherwise mint a loopback session for
      # whoever owns the oldest workspace. The suite drives the sign-in form
      # and invitation links; auto-login hides both.
      POLARIS_DEV_AUTOLOGIN: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
          cache-dependency-path: services/go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C web exec playwright install --with-deps chromium

      - name: Migrate
        run: go run ./cmd/polarisctl migrate up
        working-directory: services

      # api and sync are started as background processes rather than containers so a
      # failure surfaces as a log in this job rather than in a container nobody inspects.
      - name: Start the stack
        run: |
          go build -o /tmp/polaris-api ./cmd/api
          go build -o /tmp/polaris-sync ./cmd/sync
          # The worker too. Inbox rows are not written by the mutation that causes them —
          # domain.FanOutAll reads the change stream on a ticker in cmd/worker, and nothing
          # else calls it. Without this process an inbox is empty forever, so every
          # notification assertion in the suite failed here while passing on a developer's
          # machine, where the whole stack is up.
          go build -o /tmp/polaris-worker ./cmd/worker
          /tmp/polaris-api    > /tmp/api.log    2>&1 &
          /tmp/polaris-sync   > /tmp/sync.log   2>&1 &
          /tmp/polaris-worker > /tmp/worker.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8088/healthz && break
            sleep 1
          done
        working-directory: services

      - run: pnpm -C web e2e

      - name: Server logs on failure
        if: failure()
        run: tail -200 /tmp/api.log /tmp/sync.log /tmp/worker.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # The checks that read two artefacts and compare them. Each exists because the two sides
  # compile, lint and test independently and can still disagree — which is the only kind of
  # bug none of the jobs above can see.
  discipline:
    name: Cross-artefact discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/lint-keymap.sh
      - run: bash scripts/lint-tokens.sh
      # A fractional order key compared with localeCompare. Byte order and linguistic order
      # agree for the first five entries of any list and part company at the sixth, so this
      # is invisible in every fixture and permanent in every workspace somebody uses.
      - run: bash scripts/lint-order-keys.sh
      # The reverse proxy against the routes the servers register. `handle /sync*` sent the
      # bootstrap to a process that does not serve it, and every self-hosted install came up
      # with an empty workspace behind a socket reporting healthy.
      - run: bash scripts/lint-routes.sh
      # A `:?` guard in an opt-in compose service. Compose interpolates every service before
      # it picks profiles, so one of those broke `docker compose up` for everybody.
      - run: bash scripts/lint-compose.sh
      # Desktop artefacts that ship two architectures under one name. electron-builder's
      # default leaves the x64 build unlabelled, so the plain filename is the Intel one —
      # and macOS 26 tells whoever downloads it that the app needs updating.
      - run: bash scripts/lint-desktop.sh
      # An image that pins ENTRYPOINT to one of its four binaries, so `command:` selects
      # nothing and every service runs the API. `docker compose up` deadlocked on it.
      - run: bash scripts/lint-images.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # The workflow default is contents:read. gitleaks-action on pull_request
    # lists PR commits (pull-requests:read) and comments the summary
    # (pull-requests:write). Without this it 403s on PRs and the check is
    # red even when nothing leaked — which is what happened on #1–#5.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Deploy
  #
  # Polaris was `deploy: manual` in the fleet registry, which meant every release
  # reached production only when somebody remembered to run the command by hand —
  # and production sat two tags behind main for a day without anything saying so.
  #
  # This job is the fix, and it is deliberately the *last* job in the same
  # workflow rather than a `workflow_run` listener: `needs` gives ordering the
  # scheduler enforces, so nothing can reach the server until every check above it
  # has actually passed. A separate workflow keyed on "CI finished" would have to
  # re-derive that, and would deploy on a run whose conclusion it read wrong.
  #
  # It deploys the exact commit CI validated, not whatever main happens to be when
  # the SSH lands. Two merges a minute apart would otherwise race, and the second
  # deploy could ship the first commit twice while the second is never built.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [go, go-ee, generated, web, e2e, discipline, secrets]
    # Pushes to main only. Not tags: tags are cut from commits already on main and
    # would deploy the same tree a second time. Not pull_request: a fork PR would
    # otherwise ask for production credentials, and gets none.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Named so that GitHub's environment protection rules apply if you ever want a
    # human approval or a deploy window in front of this — Settings → Environments.
    environment: production
    # An ssh that hangs should fail the run, not hold the production concurrency
    # group open for six hours while every later merge queues behind it.
    timeout-minutes: 20
    # One deploy at a time, and never cancel one in flight: `docker compose up
    # --build` interrupted halfway leaves the stack half-new, which is worse than
    # queueing behind it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check the deploy credentials exist
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$USER" ] && missing="$missing DEPLOY_USER"
          [ -z "$KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Automatic deploys are on, but these repository secrets are missing:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions, then re-run this job."
            echo "Until then main is red on purpose: a deploy job that quietly succeeded"
            echo "without deploying would be indistinguishable from a working one."
            exit 1
          fi

      - name: Deploy the commit this run validated
        env:
          # Through the environment, never interpolated into the script body:
          # `${{ }}` pastes text in before the shell runs, so a value carrying a
          # quote or a backtick would be executed rather than read.
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          SSH_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Raw ssh rather than a marketplace action. This repository is public and
          # this is the one job holding a production key: a third-party action here
          # is a supply-chain dependency on somebody else's release process, for
          # the sake of six lines of shell.
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key instead of accepting whatever answers on the night.
          # StrictHostKeyChecking=no would make this job hand a root shell to a
          # machine-in-the-middle without a word in the log.
          if [ -z "$SSH_HOST_KEY" ]; then
            echo "::error::DEPLOY_HOST_KEY is not set. Generate it on your own machine with:"
            echo "  ssh-keyscan -p $SSH_PORT <host>"
            echo "and paste the line for your host. Without it this job cannot tell your"
            echo "server from anything else that answers on that address."
            exit 1
          fi
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # The whole request is one commit sha.
          #
          # This key is pinned in the server's authorized_keys to
          # `command="/root/polaris-deploy.sh"`, so whatever is sent here never reaches a
          # shell: sshd runs that script and hands it this string in SSH_ORIGINAL_COMMAND.
          # The script refuses anything that is not 40 hex characters, and refuses a sha
          # that is not already an ancestor of origin/main.
          #
          # That is why this is not a script piped to `bash -s` any more. A pipeline that
          # sends commands means the secret in this job is a root shell on production, held
          # by a public repository — and the blast radius of a leaked or misused key should
          # be "it deployed a commit that was already on main", not "it owns the machine".
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$SHA"

      - name: Check it came back up
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL || 'https://polaris.peixotolabs.com/healthz' }}
        run: |
          set -euo pipefail
          # A deploy that returns zero and leaves the site down is the failure mode
          # worth catching: `docker compose up -d` exits as soon as the containers
          # are created, long before anything serves a request.
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "attempt ${attempt}: $HEALTH_URL -> ${code:-no answer}"
            sleep 10
          done
          echo "::error::$HEALTH_URL never returned 200. The deploy ran; the site is not serving."
          exit 1
