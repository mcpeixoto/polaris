<!--
  The Polaris mark, as the desktop app icon.

  The drawing is not decided here. `web/src/components/Logo.tsx` draws the mark on a 40x40
  grid and is the source of truth for it; this file is that drawing scaled up by 25.6 to fill
  a 1024 icon, which is why every coordinate below is still a Logo.tsx coordinate. It used to
  be a different star — a shorter tip, a waist pulled to about a third of the canonical depth,
  and no orbit or rays at all — so the app icon and the app's own header showed two different
  logos. If the star changes, it changes in Logo.tsx first.

  This SVG is the reference drawing, and it is not what ships: `make-icon.py` renders the
  binaries, because an SVG rasterised by whichever delegate a machine happens to have
  installed produced a silently black square once already. Keep the two in step.

  Three constraints shaped the mark, and all three are about the sizes it actually appears at:

    * It must survive 16px, because that is a favicon and a Windows taskbar. The star does.
      The orbit and the rays do not — they are a 1-unit and a 1.4-unit stroke on a 40-unit
      grid, which is a fraction of a pixel there — so make-icon.py drops them below 64px and
      keeps the star alone. That threshold is written down in its header.
    * It must survive being masked. macOS Big Sur onwards, Android, and every OS since put
      icons inside a shape they choose, so the mark is inset to 82% of the square rather than
      bleeding to the edge.
    * It must read on both a light and a dark dock. Hence the deep ground rather than a
      transparent one: a thin accent-coloured star alone would vanish against a light
      wallpaper.

  The colours are the product's own accent ramp from web/src/styles/tokens.css, so the icon
  and the interface are the same blue rather than two blues nobody quite matched. An icon file
  is painted by an OS that cannot read tokens.css, which is why the literals are here and why
  each one is named.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Top-left light, as every physical object is. Flat fills read as stickers. -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <!-- --color-neutral-900 to --color-neutral-950 -->
      <stop offset="0" stop-color="#1a1d22"/>
      <stop offset="1" stop-color="#0e1013"/>
    </linearGradient>
    <linearGradient id="star" x1="0.15" y1="0" x2="0.85" y2="1">
      <!-- --color-accent-400 to --color-accent-600 -->
      <stop offset="0" stop-color="#7a83e6"/>
      <stop offset="1" stop-color="#4b56ba"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.42">
      <!-- --color-accent-500 -->
      <stop offset="0" stop-color="#5e6ad2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5e6ad2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 22.4% corner radius: the macOS squircle proportion, close enough that the icon does
       not look like a different shape sitting next to system apps. -->
  <rect width="1024" height="1024" rx="229" fill="url(#ground)"/>
  <rect width="1024" height="1024" rx="229" fill="url(#glow)"/>

  <!-- 25.6 = 1024 / 40: the rest of this file is Logo.tsx's grid, unchanged, inset to 82%. -->
  <g transform="scale(25.6)">
    <g transform="translate(20 20) scale(0.82) translate(-20 -20)">
      <!-- The orbit: a hairline that describes the star rather than a second shape
           competing with it. Opacity 0.42, as .ring in Logo.module.css. -->
      <ellipse cx="20" cy="20" rx="17.5" ry="6.8" transform="rotate(-24 20 20)"
               fill="none" stroke="#5e6ad2" stroke-width="1" opacity="0.42"/>

      <!-- The four rays, r=8.5 out to r=13.5, in the empty quarter between two points. -->
      <g stroke="#5e6ad2" stroke-width="1.4" stroke-linecap="round" opacity="0.55">
        <line x1="26.01" y1="13.99" x2="29.55" y2="10.45"/>
        <line x1="13.99" y1="13.99" x2="10.45" y2="10.45"/>
        <line x1="13.99" y1="26.01" x2="10.45" y2="29.55"/>
        <line x1="26.01" y1="26.01" x2="29.55" y2="29.55"/>
      </g>

      <!-- The star. Points to r=15.5, waist pulled to r~4.5 by control points 3.2 off
           centre: that ratio is what makes the points read as sharp rather than as a
           rounded plus sign, and it is the number the old icon had wrong. -->
      <path fill="url(#star)"
            d="M20 4.5Q23.2 16.8 35.5 20 23.2 23.2 20 35.5 16.8 23.2 4.5 20 16.8 16.8 20 4.5Z"/>

      <!-- The two vertical points again over the star. One path, and the star stops being a
           silhouette and starts being faceted like a compass rose. -->
      <path fill="#7a83e6" opacity="0.9"
            d="M20 4.5Q23.2 16.8 20 20 16.8 16.8 20 4.5ZM20 35.5Q23.2 23.2 20 20 16.8 23.2 20 35.5Z"/>

      <!-- The pierced centre, in the ground colour. -->
      <circle cx="20" cy="20" r="1.7" fill="#0e1013"/>
    </g>
  </g>

  <!-- The inner edge, a hairline lighter than the ground. Icons without one look pasted
       onto the dock rather than lit by the same room. -->
  <rect x="2" y="2" width="1020" height="1020" rx="228"
        fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
</svg>
