server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The SPA is one HTML file plus content-hashed assets. index.html must never be
    # cached — it is the only thing that names the current bundle, so a cached copy pins
    # a browser to a deployment that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Everything Vite emits carries a content hash in its filename, so it can be cached
    # forever: a new build produces new names rather than new contents at old names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routing: any path that is not a file is the app's problem, not nginx's.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Content-Security-Policy lives here rather than on API responses, because this is the
    # only response that becomes a document. 'unsafe-inline' on style-src is required by
    # the runtime style injection React does; script-src has no such escape hatch, which
    # is the half that actually stops an injected <script>.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Serves the .br/.gz files Vite emitted at build time instead of compressing on every
    # request — better ratio, no CPU cost per response.
    gzip_static on;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
